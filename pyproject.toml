[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "efficientnet-channel-diagnostics"
version = "0.2.0"
description = "Contrastive channel attribution and spatial overlays for timm EfficientNet classifiers"
requires-python = ">=3.10"
dependencies = ["torch>=2.6", "torchvision>=0.21", "timm>=1.0,<2", "numpy>=1.24", "Pillow>=10", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
efficientnet-diagnose = "efficientnet_diagnostics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
